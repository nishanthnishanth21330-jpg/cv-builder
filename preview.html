<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Builder — Preview</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sidebar-root"></div>

<div class="app-shell">
  <div class="main">
    <p class="page-eyebrow no-print">STEP 6</p>
    <h1 class="page-title no-print" id="previewHeading">Your CV</h1>
    <p class="page-lede no-print">This is exactly how your CV will look when downloaded. Edit any section or save it as a PDF.</p>

    <div class="preview-toolbar no-print">
      <button class="btn btn-secondary" id="backToResumesBtn">← My Resumes</button>
      <div class="btn-row">
        <button class="btn btn-secondary" id="editCvBtn">✏️ Edit CV</button>
        <button class="btn btn-primary" id="downloadPdfBtn">📥 Download CV as PDF</button>
      </div>
    </div>

    <div class="resume-stage" id="resumeStage"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
<script>initPreviewPage();</script>
</body>
</html>
