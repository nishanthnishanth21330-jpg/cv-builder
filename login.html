<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Builder — Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-brand"><span>CV</span> Builder</p>
    <p class="auth-sub">Enter your name and email to start building your resume. No password required.</p>

    <div class="form-banner" id="loginBanner"></div>

    <form id="loginForm" novalidate>
      <div class="field" id="nameField">
        <label for="nameInput">👤 Full Name</label>
        <input type="text" id="nameInput" placeholder="e.g. name" autocomplete="name">
        <div class="error-msg">Please enter your full name.</div>
      </div>
      <div class="field" id="emailField">
        <label for="emailInput">📧 Email ID</label>
        <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
        <div class="error-msg">Please enter a valid email address.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p style="text-align:center;margin-top:22px;">
      <a href="index.html" style="font-size:13.5px;color:var(--ink-soft);">← Back to Home</a>
    </p>
  </div>
</div>

<script src="script.js"></script>
<script>initLoginPage();</script>
</body>
</html>
